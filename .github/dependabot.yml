# Dependabot version-update configuration.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # npm workspaces monorepo: a single root package-lock.json covers all workspaces.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # ESLint majors break the flat-config plugin chain (eslint-plugin-react
      # did not support eslint 10 when #46 was closed). Take majors manually
      # once the plugins catch up; minor/patch updates still flow.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/*"
        update-types: ["version-update:semver-major"]
    groups:
      # Collapse low-risk dev-tooling bumps into one PR to reduce noise.
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # Keep the GitHub Actions used by the release workflow up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
